services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terzocloud-app
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/terzocloud_assets
      INVOICE_PARSER_URL: http://invoice-parser:8001
      INVOICE_PARSER_TIMEOUT_MS: 30000
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  invoice-parser:
    build:
      context: .
      dockerfile: services/invoice_parser/Dockerfile
    container_name: terzocloud-invoice-parser
    environment:
      OCR_ENABLED: "true"
      OCR_MAX_PAGES: "3"
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    container_name: terzocloud-mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
